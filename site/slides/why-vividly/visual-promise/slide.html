<main class="visual-promise">
  <section class="promise-beat" data-promise-beat>
    <div class="promise-copy">
      <p class="promise-eyebrow">The expressive problem</p>
      <h1>Some ideas need to move.</h1>
    </div>

    <div class="promise-art billiards-study" aria-hidden="true">
      <canvas class="billiards-table"></canvas>
    </div>
  </section>

  <section class="promise-beat promise-beat-owl" data-promise-beat>
    <div class="promise-copy">
      <p class="promise-eyebrow">The ambition</p>
      <h1>But motion is only the beginning.</h1>
      <p class="promise-statement promise-question" data-owl-question>
        What if your explanation could live up to your imagination?
      </p>
    </div>

    <div class="promise-art owl-study" aria-hidden="true">
      <svg viewBox="180 0 840 760">
        <defs>
          <path data-owl-source></path>
          <linearGradient data-owl-gradient x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff8e8"></stop>
            <stop offset=".48" stop-color="#f5c36a"></stop>
            <stop offset="1" stop-color="#bb713d"></stop>
          </linearGradient>
          <filter data-owl-glow-filter x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
          <filter data-owl-shadow-filter x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="13"></feGaussianBlur>
          </filter>
        </defs>
        <ellipse class="owl-pool" cx="612" cy="640" rx="330" ry="38"></ellipse>
        <path class="owl-wire owl-shadow"></path>
        <path class="owl-wire owl-glow"></path>
        <path class="owl-wire owl-body"></path>
        <circle class="owl-tip" r="10"></circle>
        <circle class="owl-tip" r="10"></circle>
        <circle class="owl-tip" r="10"></circle>
      </svg>
    </div>
  </section>

  <vividly-step-progress class="promise-progress" advance></vividly-step-progress>
</main>
