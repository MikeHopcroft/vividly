id: labs
title: Labs
theme: ../vividly/themes/dark.css
transition: cut
keyboardHints: auto

nodes:
  - type: slide
    id: intro
    title: Labs
    module: ../slides/documentation/placeholder.js
    props:
      eyebrow: Creative presentation workflows
      title: Labs
      promise: Experiments in developing presentations, from first idea to finished slide.
      planned:
        - Pool table breaks gallery
        - Owl drawing with one pen or many
        - Color scheme exploration
        - Movie poster development
        - Agentic image prompting
      status: Intro placeholder - future example navigator

  - type: slide
    id: pool-table-breaks
    title: Pool Table Breaks
    module: ../slides/experiments/pool-table-break/candidates-slide.js
    props:
      heading: Pool Table Breaks
      introduction: "A creative workflow: generate variations, compare the motion, then choose a starting point. Six candidates from a 256-seed search sit alongside the original seed 7. Each uses the same simulation and rendering; only the seed changes. Stills show the settled result. Replay individual breaks or the whole gallery, and scroll to compare all seven."

  - type: slide
    id: owl
    title: Owl
    module: ../slides/labs/owl/slide.js

  - type: slide
    id: color-schemes
    title: Color Schemes
    module: ../slides/labs/color-schemes/slide.js

  - type: slide
    id: movie-poster-development
    title: Movie Poster Development
    module: ../slides/labs/movie-poster-development/slide.js
    data: ../slides/labs/movie-poster-development
    props:
      src: ./document.md

  - type: slide
    id: agentic-image-prompting
    title: Agentic Image Prompting
    module: ../slides/documentation/placeholder.js
    props:
      eyebrow: Labs / Image workflows
      title: Agentic Image Prompting
      promise: Develop images collaboratively through references, prompts, and successive refinements.
      planned:
        - Example images -> text prompt -> text modifications -> new image
        - Prompting for progressive image builds
      status: Agentic image prompting placeholder

  - type: slide
    id: prompting-image-builds
    title: Prompting Image Builds
    transition: dissolve
    module: ../slides/labs/prompting-image-builds/slide.js
    data: ../slides/labs/prompting-image-builds
    props:
      src: ./document.md

  - type: slide
    id: prompting-image-builds-first
    title: Image Build - First Image
    transition: dissolve
    module: ../vividly/slides/image.js
    data: ../slides/labs/prompting-image-builds
    props:
      src: ./assets/first.png
      alt: First image build
      fit: cover

  - type: slide
    id: prompting-image-builds-second
    title: Image Build - Second Image
    transition: dissolve
    module: ../vividly/slides/image.js
    data: ../slides/labs/prompting-image-builds
    props:
      src: ./assets/second.png
      alt: Second image build
      fit: cover
